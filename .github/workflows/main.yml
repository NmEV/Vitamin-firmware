name: Build Pico Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # manual trigger

# Keep these in sync with the local toolchain used by the Pico VS Code
# extension (see CMakeLists.txt and .vscode/settings.json): CI must build with
# the same SDK/GCC the project is developed against.
env:
  SDK_VERSION: 2.3.0
  TOOLCHAIN_VERSION: 14.2.rel1
  TOOLCHAIN_DIR_NAME: arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi
  # FIXED tag under which the release job publishes the compiled firmware.
  # Every build on main/master replaces the release with this name (old
  # release + tag are deleted and recreated at the new commit), so the
  # download URL stays stable and always points at the newest firmware.
  RELEASE_TAG: usbnet-firmware

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Build both families on every push: flash layout, stack size and
        # USB behaviour differ between RP2040 and RP2350.
        board: [ pico, pico2 ]

    steps:
    # TODO: pin these actions to full commit SHAs (e.g. via dependabot) once
    # this repository is hosted on GitHub.
    - name: Checkout Project
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake build-essential git wget xz-utils

    # Cache the ARM toolchain and the SDK (with submodules) between runs;
    # the toolchain tarball alone is ~250 MB.
    - name: Cache ARM GCC Toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/arm-toolchain
        key: arm-gcc-${{ env.TOOLCHAIN_VERSION }}-${{ runner.os }}

    - name: Cache Pico SDK
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/pico-sdk
        key: pico-sdk-${{ env.SDK_VERSION }}-${{ runner.os }}

    - name: Download and Install ARM GCC Toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        wget -q --tries=5 --timeout=30 "https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.TOOLCHAIN_VERSION }}/binrel/${{ env.TOOLCHAIN_DIR_NAME }}.tar.xz"
        mkdir -p "${{ github.workspace }}/arm-toolchain"
        tar -xJf "${{ env.TOOLCHAIN_DIR_NAME }}.tar.xz" -C "${{ github.workspace }}/arm-toolchain" --strip-components=1
        rm -f "${{ env.TOOLCHAIN_DIR_NAME }}.tar.xz"

    - name: Clone Pico SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch "${{ env.SDK_VERSION }}" https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init --recursive

    - name: Export Toolchain Paths
      run: |
        echo "PICO_SDK_PATH=${{ github.workspace }}/pico-sdk" >> $GITHUB_ENV
        echo "PICO_TOOLCHAIN_PATH=${{ github.workspace }}/arm-toolchain" >> $GITHUB_ENV
        echo "${{ github.workspace }}/arm-toolchain/bin" >> $GITHUB_PATH

    - name: Build (${{ matrix.board }})
      run: |
        mkdir -p build
        cd build
        cmake -DPICO_BOARD=${{ matrix.board }} \
              -DCMAKE_BUILD_TYPE=Release \
              -DPICO_TOOLCHAIN_PATH="${{ env.PICO_TOOLCHAIN_PATH }}" \
              ..
        make -j$(nproc)

    # Storage (storage.c) occupies one 4 KB sector at flash offset 256 KB and
    # the firmware is linked at the start of flash: fail loudly if the code
    # ever grows into that region.
    - name: Check Firmware Size
      run: |
        arm-none-eabi-size "${{ github.workspace }}/build/usbnet.elf"
        flash_usage=$(arm-none-eabi-size --format=berkeley "${{ github.workspace }}/build/usbnet.elf" | awk 'NR==2 {print $1 + $2}')
        if [ "$flash_usage" -ge 262144 ]; then
          echo "::error::firmware ($flash_usage B) reaches the 256 KB flash slot used by storage.c" >&2
          exit 1
        fi
        echo "Firmware flash usage (text+data): $flash_usage bytes (< 256 KB storage slot OK)"

    - name: Upload Artifacts (${{ matrix.board }})
      uses: actions/upload-artifact@v4
      with:
        name: usbnet-firmware-${{ matrix.board }}
        # usbnet.uf2 is the file to flash; usbnet.elf/.bin and usbnet.map are
        # included for debugging and layout checks.
        path: |
          build/*.uf2
          build/*.elf
          build/*.bin
          build/usbnet.map

  # ---------------------------------------------------------------------------
  # Publish compiled firmware to a GitHub Release under one FIXED tag
  # (env.RELEASE_TAG, above). Runs after the build for every push to
  # main/master and for manual workflow_dispatch runs: the previous release
  # and tag are removed first (GitHub refuses to move a tag that still has a
  # release attached), then the release is recreated at the current commit.
  # Asset names are stable per board (usbnet-pico.uf2 / usbnet-pico2.uf2), so
  # a script can always download "the latest firmware" from the same URL.
  # ---------------------------------------------------------------------------
  release:
    name: Publish rolling firmware Release
    if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: firmware-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download pico build
        uses: actions/download-artifact@v4
        with:
          name: usbnet-firmware-pico
          path: artifacts/pico

      - name: Download pico2 build
        uses: actions/download-artifact@v4
        with:
          name: usbnet-firmware-pico2
          path: artifacts/pico2

      - name: Stage release assets
        run: |
          set -euo pipefail
      
          mkdir -p assets
      
          # pico (RP2040)
          cp artifacts/pico/usbnet.uf2 assets/usbnet-pico.uf2
          cp artifacts/pico/usbnet.elf assets/usbnet-pico.elf
          cp artifacts/pico/usbnet.map assets/usbnet-pico.map
      
          # pico2 (RP2350)
          cp artifacts/pico2/usbnet.uf2 assets/usbnet-pico2.uf2
          cp artifacts/pico2/usbnet.elf assets/usbnet-pico2.elf
          cp artifacts/pico2/usbnet.map assets/usbnet-pico2.map
      
          # 打包每个板子的完整调试文件
          (
            cd artifacts/pico
            zip -qr ../usbnet-firmware-pico.zip .
          )
      
          (
            cd artifacts/pico2
            zip -qr ../usbnet-firmware-pico2.zip .
          )
      
          echo "=== Final release assets ==="
          find assets -type f -printf '%p\n' | sort
          ls -lh artifacts/*.zip

      - name: Remove previous fixed-tag release
        run: |
          set -euo pipefail
          # Deleting the release also cleans up the tag if --cleanup-tag is
          # given; a leftover tag without a release is removed via the API.
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" 2>/dev/null || true

      - name: Create release
        run: |
          set -euo pipefail
          short_sha=$(echo "$GITHUB_SHA" | cut -c1-8)
          date_str=$(date -u +%Y-%m-%d)
          {
            echo "**Built from** [$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) ($date_str)"
            echo ""
            echo 'Flash with BOOTSEL held: drag usbnet-pico.uf2 (RP2040) or usbnet-pico2.uf2 (RP2350) onto the RPI-RP2 drive.'
            echo ""
            echo 'The *.zip assets contain the ELF/BIN/MAP for the matching build (debugging / layout checks).'
            echo ""
            echo "This release is rolling: the $RELEASE_TAG tag is force-moved to the newest main/master build,"
            echo "so this page always shows the latest firmware."
          } > notes.md
          gh release create "$RELEASE_TAG" assets/usbnet-pico.uf2 assets/usbnet-pico2.uf2 \
            assets/usbnet-pico.elf assets/usbnet-pico2.elf \
            assets/usbnet-pico.map assets/usbnet-pico2.map \
            artifacts/usbnet-firmware-pico.zip artifacts/usbnet-firmware-pico2.zip \
            --target "$GITHUB_SHA" \
            --title "usbnet firmware $short_sha ($date_str)" \
            --notes-file notes.md
